name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # `npm run build` prerenders every route in a headless browser, so the
      # build needs Chromium available.
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

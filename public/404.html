<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — NSENGIMANA Olivier</title>
    <!--
      A genuine not-found page. This used to be a copy of index.html, which made
      every unknown URL return a full page of content under a 404 status — search
      engines read that as a soft 404. Real routes are prerendered to their own
      files, so nothing needs the old SPA-fallback trick any more.
    -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        font: 16px/1.7 system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
        background: #ffffff;
        color: #171717;
      }
      main { max-width: 30rem; text-align: center; }
      .code {
        font-size: 0.75rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #6b6b6b;
      }
      h1 { font-size: 1.75rem; line-height: 1.25; margin: 0.75rem 0 0.5rem; }
      p { color: #4b4b4b; margin: 0 0 1.75rem; }
      a.home {
        display: inline-block;
        padding: 0.7rem 1.6rem;
        border-radius: 999px;
        background: #3d5afe;
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }
      a.home:hover { background: #2f49e0; }
      nav { margin-top: 1.75rem; font-size: 0.85rem; }
      nav a { color: #3d5afe; margin: 0 0.5rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #000000; color: #f5f5f5; }
        .code { color: #8f8f8f; }
        p { color: #b5b5b5; }
        a.home { background: #6c82ff; color: #05050a; }
        a.home:hover { background: #8397ff; }
        nav a { color: #8ea2ff; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn't exist</h1>
      <p>The link may be out of date, or the address mistyped.</p>
      <a class="home" href="/">Back to the portfolio</a>
      <nav>
        <a href="/#projects">Projects</a>
        <a href="/#about">About</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback so client-side routing / deep links resolve to index.html,
# while leaving the serverless function routes untouched.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
